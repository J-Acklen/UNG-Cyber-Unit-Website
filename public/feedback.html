<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>CyberUnit @ UNG — Feedback</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ─── Navbar ──────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="/" class="navbar-logo"><img src="/images/CyberUnitLogo_Transparent.png" alt="CyberUnit @ UNG" class="navbar-logo-img"><span class="navbar-logo-text">[ CyberUnit @ UNG ]</span></a>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/feedback">Feedback</a></li>
        <li id="authNavItem"></li>
      </ul>
    </div>
  </nav>

  <main class="page-body">
    <div class="container" style="max-width: 700px; padding: 2rem 1rem;">

      <header style="margin-bottom: 2rem;">
        <h1>// Feedback</h1>
        <p style="color: var(--text-muted); font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; margin: 0.4rem 0 0;">
          Suggestions to improve the unit or the site — open to everyone, no account needed.
        </p>
      </header>

      <div id="feedbackFormWrap">
        <form id="feedbackForm" class="announcement-form">
          <p class="form-error" id="feedbackFormError" hidden></p>
          <div class="form-group">
            <label for="feedbackMessage">Your suggestion</label>
            <textarea id="feedbackMessage" rows="6" maxlength="5000" required placeholder="What would make the unit or the site better?"></textarea>
          </div>
          <div class="announcement-form-actions">
            <button type="submit" class="btn btn-primary" id="feedbackFormSubmit">Send Feedback</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
